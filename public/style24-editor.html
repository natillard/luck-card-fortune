<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Style24 기획전 에디터 V5</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Pretendard',-apple-system,sans-serif;color:#222;background:#e5e1dc;line-height:1.5}
img{max-width:100%;display:block}

/* 에디터 전용 스타일 */
.editor-panel{position:sticky;top:0;z-index:1000;background:#222;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}
.editor-title{color:#fff;font-size:14px;font-weight:600}
.editor-btns{display:flex;gap:8px}
.editor-btn{padding:8px 16px;border:1px solid rgba(255,255,255,0.3);border-radius:6px;background:transparent;color:#fff;font-size:12px;cursor:pointer}
.editor-btn:hover,.editor-btn.active{background:#fff;color:#222}
.editor-btn.preview-active{background:#2563eb;border-color:#2563eb;color:#fff}

/* 미리보기 모드 시 숨김 처리 */
body.preview-mode .block-controls,
body.preview-mode .overlay-controls,
body.preview-mode .add-benefit-wrapper,
body.preview-mode .add-block-panel,
body.preview-mode .add-benefit-panel,
body.preview-mode .add-timer-panel,
body.preview-mode .add-notice-panel,
body.preview-mode .add-notice-item-btn,
body.preview-mode .benefit-controls { display: none !important; }

/* 숨김 처리된 블록 스타일 (편집 모드) */
.content-block.is-hidden { opacity: 0.3; filter: grayscale(0.5); transition: opacity 0.3s; }
.content-block.is-hidden:hover { opacity: 0.5; }

/* 미리보기 모드에서는 숨김 블록 아예 안보이게 */
body.preview-mode .content-block.is-hidden { display: none !important; }

/* 모든 영역 간격 100px 통일 */
.content-block, .add-benefit-panel, .add-block-panel, .add-timer-panel, .add-notice-panel { margin-bottom: 100px !important; }
.content-block:last-child { margin-bottom: 0 !important; }

.preview-wrapper{width:100%;overflow-x:auto}
.preview-container{width:1920px;margin:0 auto;background:#fff;transition: width 0.3s ease;}
.preview-inner{max-width:1440px;margin:0 auto}
.preview-container.mobile-view{width:1080px}
.preview-container.mobile-view .preview-inner{max-width:1080px}

.content-block{position:relative}
.content-block:hover .block-controls,.content-block:hover .overlay-controls{opacity:1}
.block-controls{position:absolute;top:12px;right:12px;display:flex;gap:6px;z-index:20;opacity:0;transition:opacity 0.2s}
.block-ctrl-btn{width:32px;height:32px;border-radius:6px;border:none;background:rgba(255,255,255,0.95);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,0.15);font-size:14px}
.block-ctrl-btn:hover{transform:scale(1.05)}
.block-ctrl-btn.delete{color:#dc2626}
.block-label{padding:6px 10px;background:rgba(255,255,255,0.95);border-radius:6px;font-size:10px;font-weight:600;color:#666;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.overlay-controls{position:absolute;bottom:12px;right:12px;display:flex;gap:6px;z-index:20;opacity:0;transition:opacity 0.2s}
.overlay-ctrl-btn{padding:6px 12px;border-radius:6px;border:none;background:rgba(255,255,255,0.95);cursor:pointer;font-size:11px;font-weight:500;color:#444;box-shadow:0 2px 8px rgba(0,0,0,0.15)}
.overlay-ctrl-btn:hover{background:#222;color:#fff}
.overlay-ctrl-btn.active{background:#1a1a1a;color:#fff}

/* 히어로 */
.hero-section{width:100%;position:relative}
.hero-image-wrapper{width:100%;height:778px;position:relative;overflow:hidden;background:#1a1a1a}
#heroSlidesContainer{position:absolute;inset:0}
.hero-slide{position:absolute;inset:0;opacity:0;transition:opacity 0.8s}
.hero-slide.active{opacity:1;z-index:1}
.hero-slide .hero-blur-bg{position:absolute;inset:-60px;background-size:cover;background-position:center;filter:blur(50px) saturate(1.2);opacity:0.8}

/* 블러 모드 프레임 고정 설정 (Internal Scaling) */
.hero-main-image-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 516px;
    height: 778px;
    overflow: hidden;
    z-index: 2;
    background: #000;
}
.hero-main-image-frame .hero-main-image {
    position: relative;
    top: 0;
    left: 0;
    transform: none;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.hero-slide.full-mode .hero-blur-bg{display:none}
.hero-slide.full-mode .hero-main-image-frame{width:100%; height:100%;}

/* 히어로 그라디언트 */
.hero-gradient-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 40.0%;
    background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.0) 100%);
    z-index: 3;
    pointer-events: none;
}

.hero-text-wrapper{position:absolute;bottom:80px;left:50%;transform:translateX(-50%);width:516px;z-index:10;padding:0 30px}
.hero-text-wrapper.align-left{text-align:left}
.hero-text-wrapper.align-center{text-align:center}
.hero-text-wrapper.align-right{text-align:right}
.hero-top-label{font-size:10px;font-weight:500;letter-spacing:2px;color:rgba(255,255,255,0.7);margin-bottom:6px}
.hero-logo{font-size:12px;font-weight:700;letter-spacing:3px;color:#fff;margin-bottom:16px}
.hero-main-text{font-size:50px; font-weight:700;color:#fff;line-height:1.2;margin-bottom:14px;letter-spacing:-0.5px;white-space:pre-line}
.hero-sub-text{font-size:18px;font-weight:300;color:rgba(255,255,255,0.85);line-height:1.5;white-space:pre-line}
.hero-indicators{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:15}
.hero-indicator{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,0.4);cursor:pointer}
.hero-indicator.active{background:#fff;width:20px;border-radius:3px}

/* BENEFIT */
.benefit-section{padding:0 0 40px;background:#fff}
.benefit-header{text-align:center;margin-bottom:40px;padding-bottom:20px;border-bottom:2px solid #1a1a1a;max-width:800px;margin-left:auto;margin-right:auto}
.benefit-title{font-size:35px; font-weight:700;letter-spacing:2px;color:#1a1a1a;margin-bottom:8px}
.benefit-date{font-size:14px;color:#666}
.benefit-wrapper{max-width:800px;margin:0 auto}
.benefit-item{padding:40px 0;border-bottom:1px solid #e5e5e5;position:relative}
.benefit-item:last-child{border-bottom:none}
.benefit-item-inner{display:flex;gap:40px}
.benefit-number-col{width:100px;flex-shrink:0}
.benefit-number{font-size:12px;font-weight:600;color:#999;letter-spacing:1px}
.benefit-content-col{flex:1; min-width: 0; position: relative;}
.benefit-main-title{font-size:30px; font-weight:700;color:#1a1a1a;margin-bottom:8px}
.benefit-sub-text{font-size:15px;color:#666;line-height:1.7;white-space:pre-line;margin-bottom:16px}
.benefit-link-btn{display:flex;align-items:center;justify-content:space-between;background:#1a1a1a;color:#fff;padding:16px 24px;font-size:14px;font-weight:500;cursor:pointer;border:none;width:100%;max-width:400px}
.benefit-link-btn span:last-child{font-size:18px}

/* 베네핏 아이템별 컨트롤 버튼 */
.benefit-controls{position:absolute;top:0;right:0;display:flex;gap:4px;opacity:0;transition:opacity 0.2s}
.benefit-item:hover .benefit-controls{opacity:1}
.benefit-ctrl-btn{width:28px; height:28px; border-radius:4px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:12px; display:flex; align-items:center; justify-content:center; color: #444}
.benefit-ctrl-btn:hover{background:#f5f5f5}
.benefit-ctrl-btn.delete{color:#dc2626}

/* 사은품 영역 */
.benefit-gift-area{margin-top:20px; position: relative;}
.benefit-gift-grid-wrapper { overflow: hidden; width: 100%; }
.benefit-gift-grid{display:flex; gap:16px; margin-bottom:16px; transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);}
.benefit-gift-item{flex: 0 0 calc(50% - 8px); background:#f5f5f5; padding:0; text-align:center; overflow:hidden;}
.benefit-gift-item img{width:100%; height:300px; object-fit:cover; display: block;}
.benefit-gift-text-box { padding: 16px; }
.benefit-gift-item p{font-size:14px; color:#222; font-weight: 600; line-height:1.4}

.benefit-gift-indicators { display: flex; justify-content: center; gap: 8px; margin-bottom: 20px; }
.gift-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; cursor: pointer; border: none; padding: 0; }
.gift-dot.active { background: #222; width: 24px; border-radius: 4px; }

.benefit-gift-notes{font-size:12px;color:#999;line-height:1.8}
.benefit-gift-notes p{margin-bottom:4px}

/* 쿠폰 카드 */
.benefit-coupon-card{display:inline-flex;background:#1a1a1a; overflow:hidden;margin-top:16px; border-radius: 2px;}
.coupon-left{padding:20px 28px; display:flex;align-items:center;justify-content:center;border-right:1px dashed #444}
.coupon-percent{font-size:36px; font-weight:700;color:#fff}
.coupon-right{padding:16px 24px; display:flex;flex-direction:column;justify-content:center}
.coupon-name{font-size:13px; font-weight:600;color:#fff;margin-bottom:4px}
.coupon-period{font-size:11px; color:#888}

/* 공통 추가 패널 스타일 */
.add-benefit-panel, .add-block-panel, .add-timer-panel, .add-notice-panel{padding:40px;background:#fff;border-top:2px dashed #e5e5e5}
.add-benefit-title, .add-block-title, .add-timer-title, .add-notice-title{font-size:14px;font-weight:600;color:#888;margin-bottom:20px;text-align:center}
.add-benefit-grid, .add-block-grid, .add-timer-grid, .add-notice-grid{display:grid;gap:12px;max-width:800px;margin:0 auto}
.add-benefit-grid{grid-template-columns:repeat(4,1fr); max-width:700px}
.add-block-grid{grid-template-columns:repeat(5,1fr)}
.add-timer-grid, .add-notice-grid{grid-template-columns:1fr; max-width: 200px}
.add-item-btn{padding:20px;border:1px solid #e5e5e5;background:#fff;cursor:pointer;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px;border-radius:8px}
.add-item-btn:hover{border-color:#1a1a1a; transform: scale(1.02)}
.add-item-icon{font-size:24px}
.add-item-label{font-size:12px;font-weight:600;color:#444}

/* 타이머 */
.timer-section{padding:50px 0;background:#fff;text-align:center}
.timer-label{font-size:14px;font-weight:500;color:#222;margin-bottom:20px}
.timer-display{display:flex;justify-content:center;gap:20px;align-items:center}
.timer-box{text-align:center}
.timer-value{font-size:48px;font-weight:700;color:#1a1a1a;font-variant-numeric:tabular-nums}
.timer-unit{font-size:12px;color:#222;margin-top:4px}
.timer-colon{font-size:36px;font-weight:300;color:#ccc}

/* 콘텐츠 블록 간격 */
#blocksContainer .content-block{margin-bottom:100px}
#blocksContainer .content-block:last-child{margin-bottom:0}

/* 기본형 Internal Scaling 프레임 */
.basic-block{width:100%;height:560px;position:relative;overflow:hidden;background:#f0f0f0}
.basic-blur-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(40px) saturate(1.2);opacity:0.7}
.basic-main-image-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 520px;
    height: 560px;
    overflow: hidden;
    z-index: 2;
    background: #000;
}
.basic-main-image{
    position: relative;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}
.basic-block.full-mode .basic-blur-bg{display:none}
.basic-block.full-mode .basic-main-image-frame{width:100%; height:100%;}

.basic-text-area{padding:50px 0;text-align:center;background:#fff}
.basic-main-title{font-size:32px;font-weight:700;color:#1a1a1a;margin-bottom:16px;letter-spacing:1px;line-height:1.3}
.basic-sub-title{font-size:15px;color:#666;line-height:1.7;margin-bottom:8px}
.basic-highlight{font-size:14px;color:#dc2626;font-weight:500}

/* 자동스와이프 */
.swipe-block{width:100%;padding:60px 0;position:relative;overflow:hidden}
.swipe-inner{display:flex;gap:40px;padding:0 80px;align-items:flex-start}
.swipe-text-area{width:350px;flex-shrink:0;padding-top:20px}
.swipe-brand{font-size:36px;font-weight:700;color:#1a1a1a;margin-bottom:16px}
.swipe-sub-brand{font-size:14px;font-weight:600;color:#1a1a1a;margin-bottom:12px}
.swipe-desc-text{font-size:13px;color:#666;line-height:1.7}
.swipe-images-wrapper{flex:1;overflow:hidden;position:relative}
.swipe-images-area{display:flex;gap:16px;transition:transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);}
.swipe-item{flex: 0 0 calc(50% - 8px); height:480px; overflow:hidden}
.swipe-item img{width:100%;height:100%;object-fit:cover}

.swipe-indicators{display:flex; justify-content: flex-end; padding-right: 80px; margin-top: 20px; gap:8px}
.swipe-indicators.hidden{display:none}
.swipe-indicator{width:40px;height:3px;background:#ddd;cursor:pointer; border:none; padding:0}
.swipe-indicator.active{background:#1a1a1a}

/* 배경색 테마 */
.bg-white{background:#ffffff} .bg-sky{background:#e0f2fe} .bg-mint{background:#e3f9f1} .bg-indigo{background:#edf2ff}
.bg-lavender{background:#f3f0ff} .bg-pink{background:#fff0f6} .bg-rose{background:#fff5f5} .bg-lemon{background:#fff9db}
.bg-lime{background:#f4fce3} .bg-emerald{background:#e6fcf5} .bg-light-gray{background:#f5f5f5}

/* 2분할 */
.split-block{display:grid;grid-template-columns:1fr 1fr;width:100%}
.split-item{height:560px;position:relative;overflow:hidden;background:#f0f0f0}
.split-item.left-full .split-main-image{position:relative;width:100%;height:100%;object-fit:cover}
.split-item.right-blur .split-blur-bg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(35px) saturate(1.2);opacity:0.7}
.split-item.right-blur .split-main-image{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:auto;height:90%;max-width:80%;object-fit:cover;z-index:2}
.split-text-overlay{position:absolute;top:50%;left:40px;transform:translateY(-50%);z-index:5;color:#fff}
.split-brand{font-size:32px;font-weight:600;line-height:1.2;text-shadow:0 2px 12px rgba(0,0,0,0.3)}

/* 지그재그 */
.zigzag-block{width:100%;padding:100px 80px;background:#fff}
.zigzag-inner{display:flex;gap:60px;align-items:flex-start}
.zigzag-block.reversed .zigzag-inner{flex-direction:row-reverse}
.zigzag-text-area{width:280px;flex-shrink:0;padding-top:0}
.zigzag-brand{font-size:32px;font-weight:700;color:#1a1a1a;margin-bottom:8px;line-height:1.2}
.zigzag-sub{font-size:15px;color:#666}
.zigzag-images{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:flex-start}
.zigzag-img{overflow:hidden}
.zigzag-img:nth-child(1){margin-top:140px} 
.zigzag-img:nth-child(2){margin-top:0}
.zigzag-img img{width:100%;height:600px;object-fit:cover}

/* 콜라주 */
.collage-block{padding:80px;background:#fff}
.collage-header{text-align:center;margin-bottom:80px}
.collage-brand{font-size:32px;font-weight:700;color:#1a1a1a;margin-bottom:12px; line-height:1}
.collage-sub{font-size:15px;color:#666; font-weight:500}

.collage-type1{position:relative; min-height:1350px; max-width:1100px; margin:0 auto}
.collage-type1 .col-img{position:absolute; overflow:hidden}
.collage-type1 .col-img img{width:100%; height:100%; object-fit:cover}
.collage-type1 .col-img:nth-child(1){top:0; left:50%; transform:translateX(-50%); width:450px; height:450px}
.collage-type1 .col-img:nth-child(2){top:480px; left:0; width:400px; height:500px}
.collage-type1 .col-img:nth-child(3){top:420px; right:5%; width:300px; height:350px}
.collage-type1 .col-img:nth-child(4){top:930px; left:50%; transform:translateX(-50%); width:480px; height:350px}

.collage-type2{position:relative; min-height:750px; max-width:1000px; margin:0 auto}
.collage-type2 .col-img{position:absolute; overflow:hidden}
.collage-type2 .col-img img{width:100%; height:100%; object-fit:cover}
.collage-type2 .col-img:nth-child(1){top:0; right:0; width:65%; height:450px}
.collage-type2 .col-img:nth-child(2){top:280px; left:5%; width:45%; height:350px; z-index:2}

/* 유의사항 고도화 */
.notice-section{padding:100px 80px;background:#fafafa;border-top:1px solid #e5e5e5}
.notice-inner{max-width:1200px;margin:0 auto;display:flex;gap:60px;position:relative}
.notice-content-area{flex:1}
.notice-item{border-bottom:1px solid #e5e5e5; position:relative}
.notice-item:hover .item-controls { opacity: 1; }
.notice-item.active .notice-content{display:block}
.notice-item.active .notice-arrow{transform:rotate(180deg)}
.notice-title-btn{width:100%;padding:24px 0;background:none;border:none;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:600;color:#1a1a1a;cursor:pointer;text-align:left}
.notice-arrow{font-size:12px;color:#999;transition:transform 0.3s}
.notice-content{display:none;padding:0 0 24px;font-size:14px;color:#666;line-height:1.8}

.item-controls { position: absolute; top: 24px; right: 40px; display: flex; gap: 4px; opacity: 0; transition: opacity 0.2s; z-index: 10; }
.item-ctrl-btn { padding: 4px 8px; font-size: 11px; background: #fff; border: 1px solid #ddd; border-radius: 4px; cursor: pointer; }
.item-ctrl-btn:hover { background: #f5f5f5; }
.add-notice-item-btn { margin-top: 20px; width: 100%; padding: 16px; border: 1px dashed #ccc; background: #fff; color: #888; font-size: 14px; cursor: pointer; border-radius: 8px; }
.add-notice-item-btn:hover { border-color: #1a1a1a; color: #1a1a1a; }

/* 모달 */
.edit-modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:2000;padding:20px}
.edit-modal.show{display:flex}
.edit-modal-content{background:#fff;border-radius:12px;padding:24px;max-width:500px;width:100%;max-height:85vh;overflow-y:auto}
.edit-modal-title{font-size:18px;font-weight:700;margin-bottom:20px}
.edit-modal-field{margin-bottom:16px}
.edit-modal-label{display:block;font-size:12px;font-weight:600;color:#666;margin-bottom:6px}
.edit-modal-input,.edit-modal-textarea{width:100%;padding:12px;border:1px solid #e5e5e5;border-radius:6px;font-size:13px;font-family:inherit}
.edit-modal-textarea{min-height:80px;resize:vertical}
.edit-modal-btns{display:flex;gap:8px;margin-top:24px}
.edit-modal-btn{flex:1;padding:12px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;border:none}
.edit-modal-btn.primary{background:#1a1a1a;color:#fff}
.edit-modal-btn.secondary{background:#f5f5f5;color:#666}

/* 리스트 편집 스타일 */
.item-edit-list { background: #f9f7f4; border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.item-edit-row { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: 12px; display: flex; gap: 12px; align-items: center; margin-bottom: 8px; position: relative; }
.item-edit-img { width: 50px; height: 50px; border-radius: 6px; object-fit: cover; border: 1px solid #eee; }
.item-edit-label { flex: 1; font-size: 13px; font-weight: 500; color: #444; }
.item-edit-delete { width: 32px; height: 32px; border: 1px solid #ffebeb; background: #fff; color: #dc2626; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 14px; }
.item-add-btn { width: 100%; padding: 14px; background: #fff; border: 1px dashed #ccc; border-radius: 8px; color: #888; font-size: 13px; cursor: pointer; text-align: center; }

/* Toggle Switch */
.toggle-switch { position: relative; display: inline-block; width: 44px; height: 24px; }
.toggle-switch input { opacity: 0; width: 0; height: 0; }
.toggle-slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #ccc; transition: .4s; border-radius: 24px; }
.toggle-slider:before { position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
input:checked + .toggle-slider { background-color: #8b7d6b; }
input:checked + .toggle-slider:before { transform: translateX(20px); }

/* 모달 탭 및 조정 */
.mode-tabs{display:flex; gap:8px; margin-bottom:16px}
.mode-tab{flex:1; padding:14px; border:2px solid #e5e5e5; border-radius:8px; background:#fff; cursor:pointer; text-align:center}
.mode-tab.active{border-color:#1a1a1a; background:#1a1a1a; color:#fff}
.mode-tab-label{font-size:13px; font-weight:600}
.mode-tab-desc{font-size:10px; opacity:0.7; margin-top:2px}
.align-tabs{display:flex; gap:4px; margin-bottom:12px}
.align-tab{flex:1; padding:10px; border:1px solid #e5e5e5; border-radius:4px; background:#fff; cursor:pointer; text-align:center; font-size:14px}
.align-tab.active{border-color:#1a1a1a; background:#1a1a1a; color:#fff}
.image-edit-section{background:#f8f8f8; border-radius:8px; padding:16px; margin-bottom:16px}
.image-edit-label{font-size:11px; font-weight:600; color:#888; margin-bottom:12px}
.image-edit-row{display:flex; align-items:center; gap:12px; margin-bottom:10px}
.image-edit-row label{font-size:12px; color:#666; min-width:40px}
.image-edit-row input[type="range"]{flex:1; height:4px; -webkit-appearance:none; background:#e5e5e5; border-radius:2px}
.image-edit-row input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; background:#1a1a1a; border-radius:50%; cursor:pointer}
.image-edit-row .value-display{font-size:12px; font-weight:600; min-width:45px; text-align:right}
.slider-reset-btn{width:24px; height:24px; border-radius:4px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:10px; display:flex; align-items:center; justify-content:center}

/* 미리보기 모달 프레임 */
.live-preview-container{margin-top:16px; border-radius:8px; overflow:hidden; background:#f0f0f0; padding:12px}
.live-preview-label{font-size:10px; font-weight:600; color:#888; margin-bottom:8px}
.live-preview-box{width:100%; height:180px; position:relative; overflow:hidden; border-radius:6px; background:#ddd}
.live-preview-box .live-preview-blur{position:absolute; inset:-10px; background-size:cover; background-position:center; filter:blur(20px); opacity:0.7}

.live-preview-img-frame {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    height: 100%;
    aspect-ratio: 516 / 778; 
    overflow: hidden;
    z-index: 2;
    background: #000;
}
.live-preview-img-frame .live-preview-img {
    position: relative;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.upload-btn-wrapper{position:relative; overflow:hidden}
.upload-btn{width:100%; padding:14px; background:#fff; border:1px dashed #ccc; border-radius:6px; cursor:pointer; font-size:13px; color:#888; text-align:center; display:flex; align-items:center; justify-content:center; gap:8px}
.upload-btn:hover{border-color:#1a1a1a; color:#1a1a1a}
.upload-btn-wrapper input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer}

.color-chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}
.color-chip{width:32px; height:32px; border-radius:4px; cursor:pointer; border:1px solid #ddd}
.color-chip.active{border:2px solid #1a1a1a}

/* 2️⃣ BENEFIT 영역 - 중앙 정렬, 텍스트 확대, 여백 확보 */

.preview-container.mobile-view .benefit-item{padding:50px 0}
.preview-container.mobile-view .benefit-item-inner{flex-direction:column; gap:20px; text-align:center}
.preview-container.mobile-view .benefit-number-col{width:100%; text-align:center}
.preview-container.mobile-view .benefit-number{font-size:16px; letter-spacing:2px}
.preview-container.mobile-view .benefit-main-title{font-size:40px; text-align:center}
.preview-container.mobile-view .benefit-sub-text{font-size:20px; text-align:center; line-height:1.8}

/* 3️⃣ 사은품 영역 - 2개씩 슬라이드 구조, 이미지 축소 */

.preview-container.mobile-view .benefit-gift-grid{

.preview-container.mobile-view .benefit-gift-item img{height:200px; aspect-ratio:auto; object-fit:cover}
.preview-container.mobile-view .benefit-gift-text-box{padding:12px}
.preview-container.mobile-view .benefit-gift-item p{font-size:16px}
.preview-container.mobile-view .benefit-gift-indicators{margin-top:16px; margin-bottom:24px}
.preview-container.mobile-view .gift-dot{width:10px; height:10px}
.preview-container.mobile-view .gift-dot.active{width:30px}
.preview-container.mobile-view .benefit-gift-notes{font-size:14px; line-height:2; text-align:center}

/* 4️⃣ 쿠폰 영역 */
.preview-container.mobile-view .benefit-coupon-card{margin:20px auto 0; display:flex}
.preview-container.mobile-view .coupon-left{padding:24px 32px}
.preview-container.mobile-view .coupon-percent{font-size:42px}
.preview-container.mobile-view .coupon-right{padding:20px 28px}
.preview-container.mobile-view .coupon-name{font-size:16px}
.preview-container.mobile-view .coupon-period{font-size:14px}

/* 5️⃣ 타이머 영역 - 중앙 정렬, 숫자 강조 */
.preview-container.mobile-view .timer-section{padding:60px 0}
.preview-container.mobile-view .timer-label{font-size:18px; margin-bottom:24px}
.preview-container.mobile-view .timer-display{gap:16px}
.preview-container.mobile-view .timer-value{font-size:56px; font-weight:800}
.preview-container.mobile-view .timer-unit{font-size:14px; margin-top:6px}
.preview-container.mobile-view .timer-colon{font-size:40px}

/* 6️⃣ 기본형 블록 - 블러 제거, 단일 이미지 노출, 여백 확보 */
.preview-container.mobile-view .basic-block{height:auto}
.preview-container.mobile-view .basic-blur-bg{display:none}
.preview-container.mobile-view .basic-main-image-frame{
    position:relative; top:auto; left:auto; transform:none; 
    width:100%; height:auto; aspect-ratio:3/4
}
.preview-container.mobile-view .basic-text-area{padding:50px 48px; text-align:center}
.preview-container.mobile-view .basic-main-title{font-size:42px; line-height:1.25; letter-spacing:0}
.preview-container.mobile-view .basic-sub-title{font-size:20px; line-height:1.8}
.preview-container.mobile-view .basic-highlight{font-size:18px}

/* 7️⃣ 스와이프 영역 - 세로 스택, 한 장씩 좌우 스와이프, 인디케이터 표시 */
.preview-container.mobile-view .swipe-block{padding:60px 0}
.preview-container.mobile-view .swipe-inner{flex-direction:column; padding:0 48px; gap:32px}
.preview-container.mobile-view .swipe-text-area{width:100%; padding-top:0; text-align:center}
.preview-container.mobile-view .swipe-brand{font-size:42px; text-align:center}
.preview-container.mobile-view .swipe-sub-brand{font-size:18px; text-align:center}
.preview-container.mobile-view .swipe-desc-text{font-size:17px; text-align:center}
.preview-container.mobile-view .swipe-images-wrapper{width:100%; overflow:hidden}
.preview-container.mobile-view .swipe-images-area{
    display:flex; flex-direction:row; flex-wrap:nowrap; gap:0;
    transition:transform 0.4s cubic-bezier(0.4, 0, 0.2, 1)
}
.preview-container.mobile-view .swipe-item{flex:0 0 100%; width:100%; height:auto; aspect-ratio:3/4}
.preview-container.mobile-view .swipe-indicators{padding:0; margin-top:24px; justify-content:center; gap:10px}
.preview-container.mobile-view .swipe-indicator{width:10px; height:10px; border-radius:50%; background:#ddd}
.preview-container.mobile-view .swipe-indicator.active{width:10px; background:#1a1a1a}

/* 8️⃣ 2분할 영역 - 세로 스택, 블러 유지 (풀이미지 + 블러BG 오버레이) */
.preview-container.mobile-view .split-block{grid-template-columns:1fr; gap:0}
.preview-container.mobile-view .split-item{height:auto; aspect-ratio:3/4}
.preview-container.mobile-view .split-item.left-full .split-main-image{width:100%; height:100%; object-fit:cover}
.preview-container.mobile-view .split-item.right-blur{position:relative}
.preview-container.mobile-view .split-item.right-blur .split-blur-bg{
    display:block; position:absolute; inset:-30px; 
    filter:blur(35px) saturate(1.2); opacity:0.7
}
.preview-container.mobile-view .split-item.right-blur .split-main-image{
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:auto; height:85%; max-width:75%; object-fit:cover; z-index:2
}
.preview-container.mobile-view .split-text-overlay{left:40px}
.preview-container.mobile-view .split-brand{font-size:38px}

/* 9️⃣ 지그재그 영역 - 세로 스택, 좌/우 번갈아 정렬 */
.preview-container.mobile-view .zigzag-block{padding:80px 48px}
.preview-container.mobile-view .zigzag-inner{flex-direction:column !important; gap:40px}
.preview-container.mobile-view .zigzag-text-area{width:100%; text-align:center}
.preview-container.mobile-view .zigzag-brand{font-size:38px; text-align:center}
.preview-container.mobile-view .zigzag-sub{font-size:20px; text-align:center}
.preview-container.mobile-view .zigzag-images{grid-template-columns:1fr; gap:24px}
.preview-container.mobile-view .zigzag-img:nth-child(1){margin-top:0; margin-left:0}
.preview-container.mobile-view .zigzag-img:nth-child(2){margin-left:15%}
.preview-container.mobile-view .zigzag-block.reversed .zigzag-img:nth-child(1){margin-left:15%}
.preview-container.mobile-view .zigzag-block.reversed .zigzag-img:nth-child(2){margin-left:0}
.preview-container.mobile-view .zigzag-img{width:85%}
.preview-container.mobile-view .zigzag-img img{height:auto; aspect-ratio:3/4}

/* 🔟 콜라주 영역 - 불규칙 배치 유지, 자동 정렬 금지 */

.preview-container.mobile-view .collage-header{margin-bottom:50px}
.preview-container.mobile-view .collage-brand{font-size:38px}
.preview-container.mobile-view .collage-sub{font-size:20px}

}

}

    width:42% !important; height:auto !important; aspect-ratio:3/4
}

    top:68% !important; left:15% !important; right:auto !important;
    width:70% !important; height:auto !important; aspect-ratio:4/3
}

/* 콜라주 Type2 - 불규칙 배치 */
.preview-container.mobile-view .collage-type2{
    min-height:auto; display:block; position:relative;
    padding-bottom:85%
}
.preview-container.mobile-view .collage-type2 .col-img{
    position:absolute !important; transform:none !important
}
.preview-container.mobile-view .collage-type2 .col-img:nth-child(1){
    top:0 !important; left:auto !important; right:0 !important;
    width:70% !important; height:auto !important; aspect-ratio:4/5
}
.preview-container.mobile-view .collage-type2 .col-img:nth-child(2){
    top:35% !important; left:5% !important; right:auto !important;
    width:55% !important; height:auto !important; aspect-ratio:4/5; z-index:2
}

/* 1️⃣1️⃣ 유의사항 영역 - 세로 스크롤 */
.preview-container.mobile-view .notice-section{padding:80px 48px}
.preview-container.mobile-view .notice-inner{flex-direction:column; gap:40px}
.preview-container.mobile-view .notice-title-btn{font-size:20px; padding:24px 0}

.preview-container.mobile-view .notice-content{font-size:18px; line-height:2}

/* 📐 모바일 간격 조정 */

.preview-container.mobile-view #blocksContainer .content-block{margin-bottom:80px}

/* 🛠️ 모바일 추가 패널 */
.preview-container.mobile-view .add-benefit-panel,
.preview-container.mobile-view .add-block-panel,
.preview-container.mobile-view .add-timer-panel,
.preview-container.mobile-view .add-notice-panel{padding:40px 32px; margin-bottom:80px !important}
.preview-container.mobile-view .add-benefit-grid{grid-template-columns:repeat(2,1fr)}
.preview-container.mobile-view .add-block-grid{grid-template-columns:repeat(3,1fr)}
.preview-container.mobile-view .add-item-btn{padding:24px 16px}
.preview-container.mobile-view .add-item-icon{font-size:28px}
.preview-container.mobile-view .add-item-label{font-size:14px}
</style>

<div class="editor-panel">

function moveBenefit(i, dir) {
    if (dir === 'up' && i > 0) {
        var temp = benefits[i];
        benefits[i] = benefits[i - 1];
        benefits[i - 1] = temp;
    } else if (dir === 'down' && i < benefits.length - 1) {
        var temp = benefits[i];
        benefits[i] = benefits[i + 1];
        benefits[i + 1] = temp;
    }
    renderBenefits();
}

function moveGiftSlide(benefitId, index) {
    var grid = document.getElementById('giftGrid_' + benefitId);
    if(grid) { grid.style.transform = 'translateX(-' + (index * 316) + 'px)'; }
    var dots = document.querySelectorAll('#benefitWrapper .benefit-gift-indicators button');
    dots.forEach(function(dot) { if(dot.id.startsWith('giftDot_' + benefitId)) { dot.classList.toggle('active', dot.id === 'giftDot_' + benefitId + '_' + index); } });
}

        section.classList.remove('is-hidden');
        document.getElementById('benefitVisibleBtn').textContent = '👁️';

        gift:{type:'gift',mainTitle:'사은품 혜택',subText:'', showImage: true, gifts:[{image:'',desc:'설명'}],notes:['유의사항']},

    b.showImage = document.getElementById('editShowImage').checked;

    b.notes = notesText.split('\n').filter(n => n.trim() !== '');

function moveSwipePage(blockIdx, pageIdx) {
    var block = blocks[blockIdx];
    var area = document.getElementById('swipeArea_' + blockIdx);
    if(!area) return;
    var translateValue = 0;
    var imgCount = block.images.length;
    if(imgCount === 3) {
        translateValue = pageIdx * 50;
        area.style.transform = 'translateX(calc(-' + translateValue + '% - ' + (pageIdx * 8) + 'px))';
    } else {
        translateValue = pageIdx * 100;
        area.style.transform = 'translateX(-' + translateValue + '%)';
    }
    var inds = area.closest('.swipe-block').querySelectorAll('.swipe-indicator');
    inds.forEach(function(ind, idx) { ind.classList.toggle('active', idx === pageIdx); });
}

function initSwipeBlocks(){
    Object.values(swipePageIntervals).forEach(clearInterval);
    swipePageIntervals = {};
    document.querySelectorAll('.swipe-images-area').forEach(function(area){
        var id = area.id.split('_')[1];
        var block = blocks[id];
        var imgCount = block.images.length;
        var pageCount = 1;
        if(imgCount === 3) pageCount = 2;
        else if(imgCount > 3) pageCount = Math.ceil(imgCount / 2);
        if(pageCount > 1){
            var cur = 0;
            swipePageIntervals[id] = setInterval(function(){
                cur = (cur + 1) % pageCount;
                moveSwipePage(id, cur);
            }, 4000);
        }
    });
}

function startTimer(){
if(timerInterval) clearInterval(timerInterval);
timerInterval = setInterval(function(){
var now = new Date().getTime();
var target = new Date(timerData.targetDate).getTime();
var diff = target - now;
if(diff <= 0) {
    document.getElementById('timerDays').textContent = "00";
    document.getElementById('timerHours').textContent = "00";
    document.getElementById('timerMins').textContent = "00";
    document.getElementById('timerSecs').textContent = "00";
    return;
}
var d = Math.floor(diff / (1000 * 60 * 60 * 24));
var h = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
var m = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
var s = Math.floor((diff % (1000 * 60)) / 1000);
document.getElementById('timerDays').textContent = d < 10 ? '0'+d : d;
document.getElementById('timerHours').textContent = h < 10 ? '0'+h : h;
document.getElementById('timerMins').textContent = m < 10 ? '0'+m : m;
document.getElementById('timerSecs').textContent = s < 10 ? '0'+s : s;
}, 1000);
}

    btn.innerHTML='<button class="edit-modal-btn secondary" onclick="closeEditModal()">취소</button><button class="edit-modal-btn primary" onclick="saveZigzag('+index+')">저장</button>';
}else if(type==='timer'){
    t.textContent = '타이머 편집';

    btn.innerHTML='<button class="edit-modal-btn secondary" onclick="closeEditModal()">취소</button><button class="edit-modal-btn primary" onclick="saveTimer()">저장</button>';
}else if(type==='collage'){
    var b=blocks[index]; t.textContent='콜라주 편집';
    h='<div class="edit-modal-field"><label class="edit-modal-label">브랜드</label><input class="edit-modal-input" id="editColBrand" value="'+b.brand+'"></div>';
    h+='<div class="edit-modal-field"><label class="edit-modal-label">서브 (줄바꿈:엔터)</label><input class="edit-modal-input" id="editColSub" value="'+b.sub+'"></div>';
    var imgCount = (b.collageType === 1) ? 4 : 2;
    h+='<div class="item-edit-list">';
    for(var j=0; j<imgCount; j++) {
        h += `<div class="item-edit-row" data-idx="${j}"><img class="item-edit-img" src="${b.images[j]}" id="colPreview_${j}"><div style="flex:1; display:flex; flex-direction:column; gap:6px;"><div class="upload-btn-wrapper"><button class="gift-edit-small-btn" style="width:100%; padding:6px; font-size:11px; border:1px solid #ddd; background:#fff; cursor:pointer;">이미지 교체</button><input type="file" accept="image/*" onchange="updateCollageImageUI(this, ${j})"></div><div class="item-edit-label">이미지 ${j+1}</div></div></div>`;
    }
    h+='</div>';
    btn.innerHTML='<button class="edit-modal-btn secondary" onclick="closeEditModal()">취소</button><button class="edit-modal-btn primary" onclick="saveCollage('+index+')">저장</button>';
}else if(type==='notice-item'){

    h='<div class="edit-modal-field"><label class="edit-modal-label">제목</label><input class="edit-modal-input" id="editNoticeTitle" value="'+n.title+'"></div>';

    t.textContent='베네핏 섹션 편집';
    h='<div class="edit-modal-field"><label class="edit-modal-label">섹션 타이틀</label><input class="edit-modal-input" id="editBenefitSectionTitle" value="'+benefitSectionData.title+'"></div>';
    h+='<div class="edit-modal-field"><label class="edit-modal-label">기간 텍스트</label><input class="edit-modal-input" id="editBenefitSectionDate" value="'+benefitSectionData.date+'"></div>';

f.innerHTML=h; m.classList.add('show');
}

function saveBenefitSection() {
    benefitSectionData.title = document.getElementById('editBenefitSectionTitle').value;
    benefitSectionData.date = document.getElementById('editBenefitSectionDate').value;
    document.getElementById('benefitSectionTitle').textContent = benefitSectionData.title;
    document.getElementById('benefitSectionDate').textContent = benefitSectionData.date;
    closeEditModal();
}

function replaceSwipeImageUI(input, idx) {
    if(input.files && input.files[0]) {
        var r = new FileReader();
        r.onload = function(e) {
            var preview = document.getElementById('swipePreview_' + idx);
            if(preview) preview.src = e.target.result;
        };
        r.readAsDataURL(input.files[0]);
    }
}

function removeSwipeImageUI(idx) {
    var item = document.querySelector(`#swipeImagesContainer .item-edit-row[data-idx="${idx}"]`);
    if(item) item.remove();
    document.querySelectorAll('#swipeImagesContainer .item-edit-row').forEach((it, i) => {
        it.dataset.idx = i;
        var preview = it.querySelector('.item-edit-img');
        if(preview) preview.id = `swipePreview_${i}`;
        it.querySelector('.item-edit-label').textContent = `이미지 ${i+1}`;
        it.querySelector('.item-edit-delete').setAttribute('onclick', `removeSwipeImageUI(${i})`);
        it.querySelector('input[type="file"]').setAttribute('onchange', `replaceSwipeImageUI(this, ${i})`);
    });
}

function saveSwipe() {
    var b = blocks[currentEditBlock]; b.brand = document.getElementById('editSwipeBrand').value;
    b.subBrand = document.getElementById('editSwipeSubBrand').value; b.descText = document.getElementById('editSwipeDesc').value;
    if(tempSwipeBg) b.bgColor = tempSwipeBg;
    b.images = []; document.querySelectorAll('#swipeImagesContainer .item-edit-img').forEach(img => { b.images.push(img.src); });
    renderBlocks(); closeEditModal();
}

function updateSplitImageUI(input, index, side) {
    if(input.files && input.files[0]) {
        var r = new FileReader(); r.onload = function(e) {
            if(side === 'left') {
                blocks[index].leftImage = e.target.result;
                var btnImg = document.querySelector('#splitLeftBtn img');
                if(btnImg) { btnImg.src = e.target.result; btnImg.style.display = 'block'; }
            } else {
                blocks[index].rightImage = e.target.result;
                var btnImg = document.querySelector('#splitRightBtn img');
                if(btnImg) { btnImg.src = e.target.result; btnImg.style.display = 'block'; }
            }
            renderBlocks();
        }; r.readAsDataURL(input.files[0]);
    }
}

function saveSplit() {
    var b = blocks[currentEditBlock];
    b.rightBrand = document.getElementById('editSplitBrand').value;
    renderBlocks(); closeEditModal();
}

function updateZigzagImageUI(input, index, imgIdx) {
    if(input.files && input.files[0]) {
        var r = new FileReader(); r.onload = function(e) {
            blocks[index].images[imgIdx] = e.target.result;
            var btnImg = document.getElementById('zigImgBtn_' + imgIdx).querySelector('img');
            if(btnImg) { btnImg.src = e.target.result; btnImg.style.display = 'block'; }
            renderBlocks();
        }; r.readAsDataURL(input.files[0]);
    }
}

function saveZigzag(i) {
    var b = blocks[i];
    b.brand = document.getElementById('editZigBrand').value;
    b.sub = document.getElementById('editZigSub').value;
    renderBlocks(); closeEditModal();
}

function setSwipeBgUI(val) {
    tempSwipeBg = val;
    document.querySelectorAll('#swipeBgChips .color-chip').forEach(function(chip) {
        chip.classList.remove('active');
    });
    var selectedChip = document.querySelector('#swipeBgChips .color-chip[onclick="setSwipeBgUI(\''+val+'\')"]');
    if(selectedChip) selectedChip.classList.add('active');
}

function addSwipeImageUI() {
    var cont = document.getElementById('swipeImagesContainer');
    var currentCount = cont.querySelectorAll('.item-edit-row').length;
    if(currentCount >= 10) {
        alert('이미지는 최대 10개까지만 추가할 수 있습니다.');
        return;
    }
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
        if(e.target.files && e.target.files[0]) {
            var r = new FileReader();
            r.onload = function(ev) {
                var idx = cont.querySelectorAll('.item-edit-row').length;
                var div = document.createElement('div');
                div.className = 'item-edit-row';
                div.dataset.idx = idx;
                div.innerHTML = '<img class="item-edit-img" src="'+ev.target.result+'" id="swipePreview_'+idx+'"><div style="flex:1; display:flex; flex-direction:column; gap:6px;"><div class="upload-btn-wrapper"><button class="gift-edit-small-btn" style="width:100%; padding:6px; font-size:11px; border:1px solid #ddd; background:#fff; cursor:pointer;">이미지 교체</button><input type="file" accept="image/*" onchange="replaceSwipeImageUI(this, '+idx+')"></div><div class="item-edit-label">이미지 '+(idx+1)+'</div></div><button class="item-edit-delete" onclick="removeSwipeImageUI('+idx+')">✕</button>';
                cont.appendChild(div);
            };
            r.readAsDataURL(e.target.files[0]);
        }
    };
    input.click();
}

function setBasicMode(index, mode) {
    blocks[index].mode = mode;
    openEditModal(index, 'basic');
}

function updateCollageImageUI(input, imgIdx) {
    if(input.files && input.files[0]) {
        var r = new FileReader(); r.onload = function(e) {
            document.getElementById('colPreview_' + imgIdx).src = e.target.result;
        }; r.readAsDataURL(input.files[0]);
    }
}

function saveCollage(i) {
    var b = blocks[i];
    b.brand = document.getElementById('editColBrand').value;
    b.sub = document.getElementById('editColSub').value;
    b.images = [];
    document.querySelectorAll('.item-edit-img[id^="colPreview_"]').forEach(img => {
        b.images.push(img.src);
    });
    renderBlocks(); closeEditModal();
}

function saveNoticeItem() {
    var n = notices[currentEditBlock];
    n.title = document.getElementById('editNoticeTitle').value;
    n.content = document.getElementById('editNoticeContent').value;
    renderNotices(); closeEditModal();
}

function addHeroSlideUI() {
    var input = document.createElement('input'); input.type = 'file'; input.accept = 'image/*';
    input.onchange = function(e) {
        if(e.target.files && e.target.files[0]) {
            var r = new FileReader(); r.onload = function(ev) {
                heroData.slides.push({image:ev.target.result, mode:'blur', zoom:100, posX:50, posY:50});
                renderHeroSlides(); openEditModal(-1, 'hero');
            }; r.readAsDataURL(e.target.files[0]);
        }
    }; input.click();
}

function removeHeroSlideUI(idx) {
    if(heroData.slides.length > 1) { heroData.slides.splice(idx, 1); renderHeroSlides(); openEditModal(-1, 'hero'); }
}

function closeEditModal(){document.getElementById('editModal').classList.remove('show');}
function setHeroAlign(a){heroData.textAlign=a; renderHeroContent(); openEditModal(-1,'hero-text');}
function saveHeroText(){
    heroData.topLabel=document.getElementById('editHeroTopLabel').value;
    heroData.mainText=document.getElementById('editHeroMain').value;
    heroData.subText=document.getElementById('editHeroSub').value;
    renderHeroContent(); closeEditModal();
}

function saveTimer(){
    var start = document.getElementById('editTimerStartDateTime').value;
    var end = document.getElementById('editTimerDateTime').value;
    if(start) timerData.startDate = start;
    if(end) timerData.targetDate = end;
    startTimer(); closeEditModal();
}

function editHeroSlide(i){openEditModal(i,'hero-slide');}
function setSlideMode(mode){heroData.slides[currentEditBlock].mode=mode; openEditModal(currentEditBlock,'hero-slide');}
function resetSlider(id, val){ document.getElementById(id).value = val; updateLivePreview(); }

function updateSlideImage(input, idx) {
    if(input.files && input.files[0]) {
        var r = new FileReader(); r.onload = function(e) {
            if(currentEditType === 'hero-slide') {
                heroData.slides[currentEditBlock].image = e.target.result;
                var img = document.getElementById('livePreviewImg'), blur = document.getElementById('livePreviewBlur');
                if(img) img.src = e.target.result; if(blur) blur.style.backgroundImage = 'url(\'' + e.target.result + '\')';
            } else if(currentEditType === 'basic'){
                blocks[currentEditBlock].image = e.target.result;
                var img = document.getElementById('livePreviewImg'), blur = document.getElementById('livePreviewBlur');
                if(img) img.src = e.target.result; if(blur) blur.style.backgroundImage = 'url(\'' + e.target.result + '\')';
            } else if(currentEditType === 'benefit' && benefits[currentEditBlock].type === 'gift') {
                document.getElementById('giftPreview_'+idx).src = e.target.result;
            }
        }; r.readAsDataURL(input.files[0]);
    }
}

function updateLivePreview(){
    var z=document.getElementById('editZoom').value; var x=document.getElementById('editPosX').value; var y=document.getElementById('editPosY').value;
    document.getElementById('zoomValue').textContent = z + '%';
    document.getElementById('posXValue').textContent = x + '%';
    document.getElementById('posYValue').textContent = y + '%';
    var img=document.getElementById('livePreviewImg');
    if(img){ img.style.transform='scale('+(z/100)+')'; img.style.objectPosition=x+'% '+y+'%'; }
}

function saveHeroSlide(){
    var s=heroData.slides[currentEditBlock];
    s.zoom=parseInt(document.getElementById('editZoom').value); s.posX=parseInt(document.getElementById('editPosX').value); s.posY=parseInt(document.getElementById('editPosY').value);
    renderHeroSlides(); openEditModal(-1,'hero');
}

function updateBlockImage(input,type){if(input.files&&input.files[0]){var r=new FileReader();r.onload=function(e){
    if(currentEditType === 'basic'){
        blocks[currentEditBlock].image=e.target.result;
        var img = document.getElementById('livePreviewImg'), blur = document.getElementById('livePreviewBlur');
        if(img) img.src = e.target.result; if(blur) blur.style.backgroundImage = 'url(\'' + e.target.result + '\')';
    } else { blocks[currentEditBlock].image=e.target.result; renderBlocks(); }
};r.readAsDataURL(input.files[0]);}}

function saveBasic(){
    var b = blocks[currentEditBlock];
    b.mainTitle=document.getElementById('editBasicMain').value;
    b.subTitle=document.getElementById('editBasicSub').value;
    b.zoom=parseInt(document.getElementById('editZoom').value);
    b.posX=parseInt(document.getElementById('editPosX').value);
    b.posY=parseInt(document.getElementById('editPosY').value);
    renderBlocks(); closeEditModal();
}

function toggleBenefitVisibility() {
    benefitSectionData.visible = !benefitSectionData.visible;
    var section = document.getElementById('benefitSection');
    var btn = document.getElementById('benefitVisibleBtn');
    if(!benefitSectionData.visible) { section.classList.add('is-hidden'); btn.textContent = '🙈'; } 
    else { section.classList.remove('is-hidden'); btn.textContent = '👁️'; }
}

function deleteBenefitSection() {
    benefitSectionData.visible = false;
    document.getElementById('benefitSection').style.display = 'none';
}

function toggleNoticeVisibility() {
    var section = document.getElementById('noticeSection');
    var btn = document.getElementById('noticeVisibleBtn');
    if(section.classList.contains('is-hidden')) {
        section.classList.remove('is-hidden');
        btn.textContent = '👁️';
    } else {
        section.classList.add('is-hidden');
        btn.textContent = '🙈';
    }
}

function deleteNoticeSection() {
    document.getElementById('noticeSection').style.display = 'none';
}

function restoreNoticeSection() {
    var section = document.getElementById('noticeSection');
    section.style.display = 'block';
    section.classList.remove('is-hidden');
    document.getElementById('noticeVisibleBtn').textContent = '👁️';
}

function restoreTimer() {
    timerData.visible = true;
    var section = document.getElementById('timerSection');
    section.style.display = 'block';
    section.classList.remove('is-hidden');
    document.getElementById('timerVisibleBtn').textContent = '👁️';
    startTimer();
}

window.onload=function(){
    renderHeroSlides(); renderHeroContent(); renderBenefits(); renderBlocks(); renderNotices(); startTimer(); updateTimerUI();
};
</script>
