<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>스타일24 기획전 템플릿 에디터</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net">
  <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
  <style>
    /* ===== 리셋 & 기본 ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif;
      color: #2d2d2d;
      background: #f5f5f5;
      line-height: 1.6;
    }
    img { max-width: 100%; display: block; }

    /* ===== 에디터 컨트롤 패널 ===== */
    .editor-panel {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #1a1a1a;
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid #333;
    }
    .editor-title {
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .editor-title span { color: #888; font-weight: 400; font-size: 13px; }
    .editor-btns {
      display: flex;
      gap: 6px;
    }
    .editor-btn {
      padding: 8px 16px;
      border: 1px solid #444;
      border-radius: 6px;
      background: transparent;
      color: #ccc;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .editor-btn:hover { border-color: #666; color: #fff; }
    .editor-btn.active {
      background: #fff;
      color: #1a1a1a;
      border-color: #fff;
    }
    .editor-actions {
      display: flex;
      gap: 8px;
    }
    .editor-action-btn {
      padding: 8px 20px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .editor-action-btn.primary {
      background: #2563eb;
      color: #fff;
    }
    .editor-action-btn.primary:hover { background: #1d4ed8; }
    .editor-action-btn.secondary {
      background: #333;
      color: #fff;
    }
    .editor-action-btn.secondary:hover { background: #444; }

    /* ===== 프리뷰 영역 ===== */
    .preview-container {
      max-width: 1440px;
      margin: 0 auto;
      background: #fff;
      min-height: 100vh;
    }
    .preview-container.mobile-view {
      max-width: 360px;
      box-shadow: 0 0 60px rgba(0,0,0,0.15);
      margin: 24px auto;
      border-radius: 12px;
      overflow: hidden;
    }

    /* ===== 블록 컨트롤 버튼 ===== */
    .block-controls {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
      z-index: 10;
    }
    .block-ctrl-btn {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.95);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 14px;
      transition: all 0.2s;
    }
    .block-ctrl-btn:hover { transform: scale(1.05); background: #fff; }
    .block-ctrl-btn.delete { color: #dc2626; }
    .block-ctrl-btn.toggle { color: #16a34a; }
    .block-ctrl-btn.toggle.hidden { color: #999; }
    .block-label {
      padding: 6px 12px;
      background: rgba(0,0,0,0.7);
      border-radius: 4px;
      font-size: 11px;
      font-weight: 500;
      color: #fff;
    }
    .block-drag-handle {
      position: absolute;
      top: 12px;
      left: 12px;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      border: none;
      background: rgba(255,255,255,0.95);
      cursor: grab;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      font-size: 14px;
      z-index: 10;
      transition: all 0.2s;
    }
    .block-drag-handle:hover { background: #1a1a1a; color: #fff; }
    .block-drag-handle:active { cursor: grabbing; }

    /* ===== 히어로 섹션 ===== */
    .hero-section {
      width: 100%;
      position: relative;
    }
    .hero-image-wrapper {
      width: 100%;
      height: 1120px;
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
    }
    .mobile-view .hero-image-wrapper { 
      height: auto;
      aspect-ratio: 1080 / 1680;
    }

    /* 히어로 슬라이드 */
    .hero-slide {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      transition: opacity 0.8s ease-in-out;
    }
    .hero-slide.active {
      opacity: 1;
      z-index: 1;
    }
    #heroSlidesContainer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    /* FULL 모드 */
    .hero-slide.full-mode .hero-main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .hero-slide.full-mode .hero-blur-bg { display: none; }

    /* BLUR 모드 */
    .hero-slide.blur-mode .hero-blur-bg {
      position: absolute;
      top: -50px; left: -50px; right: -50px; bottom: -50px;
      background-size: cover;
      background-position: center;
      filter: blur(60px) saturate(1.3);
      opacity: 0.8;
      transform: scale(1.2);
    }
    .hero-slide.blur-mode .hero-main-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 740px;
      height: 1120px;
      object-fit: cover;
      z-index: 2;
    }
    .mobile-view .hero-slide.blur-mode .hero-main-image {
      width: 100%;
      height: 100%;
      position: relative;
      top: auto;
      left: auto;
      transform: none;
    }
    .mobile-view .hero-slide.blur-mode .hero-blur-bg { display: none; }

    /* 히어로 텍스트 오버레이 */
    .hero-text-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 5;
      padding: 120px 48px 60px;
      background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, rgba(0,0,0,0) 100%);
    }
    .hero-text-overlay.align-left { text-align: left; }
    .hero-text-overlay.align-center { text-align: center; }
    .hero-text-overlay.align-right { text-align: right; }
    .hero-text-inner {
      max-width: 740px;
      margin: 0 auto;
    }
    .hero-text-overlay.align-left .hero-text-inner { margin-left: calc(50% - 370px); margin-right: auto; text-align: left; }
    .hero-text-overlay.align-right .hero-text-inner { margin-right: calc(50% - 370px); margin-left: auto; text-align: right; }
    .mobile-view .hero-text-overlay { padding: 80px 24px 40px; }
    .mobile-view .hero-text-inner { margin: 0 !important; }
    
    .hero-logo {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 3px;
      color: rgba(255,255,255,0.9);
      margin-bottom: 16px;
    }
    .hero-logo img {
      max-height: 40px;
      display: inline-block;
    }
    .mobile-view .hero-logo { font-size: 12px; }
    .hero-main-text {
      font-size: 48px;
      font-weight: 700;
      color: #fff;
      line-height: 1.25;
      margin-bottom: 16px;
      text-shadow: 0 2px 20px rgba(0,0,0,0.3);
    }
    .hero-main-text.two-line { white-space: pre-line; }
    .mobile-view .hero-main-text { font-size: 32px; }
    .hero-sub-text {
      font-size: 18px;
      color: rgba(255,255,255,0.85);
      line-height: 1.6;
      text-shadow: 0 1px 10px rgba(0,0,0,0.3);
    }
    .hero-sub-text.two-line { white-space: pre-line; }
    .mobile-view .hero-sub-text { font-size: 15px; }

    /* 슬라이드 인디케이터 */
    .hero-indicators {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .hero-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: all 0.3s;
    }
    .hero-indicator.active {
      background: #fff;
      width: 24px;
      border-radius: 4px;
    }

    /* ===== BENEFIT 영역 ===== */
    .benefit-section {
      padding: 60px 48px;
      background: #fff;
      position: relative;
    }
    .mobile-view .benefit-section { padding: 40px 20px; }
    .benefit-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 40px;
      padding-bottom: 20px;
      border-bottom: 2px solid #1a1a1a;
      max-width: 800px;
      margin-left: auto;
      margin-right: auto;
    }
    .benefit-title {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 2px;
    }
    .mobile-view .benefit-title { font-size: 18px; }
    .benefit-date {
      font-size: 14px;
      color: #666;
    }
    .mobile-view .benefit-date { font-size: 12px; }
    .benefit-wrapper {
      max-width: 800px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 48px;
    }

    /* 혜택 아이템 */
    .benefit-item {
      position: relative;
      text-align: center;
    }
    .benefit-item-controls {
      position: absolute;
      top: 0;
      right: 0;
      display: flex;
      gap: 4px;
    }
    .benefit-main-title {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .mobile-view .benefit-main-title { font-size: 17px; }
    .benefit-sub-text {
      font-size: 15px;
      color: #555;
      line-height: 1.7;
      white-space: pre-line;
    }
    .mobile-view .benefit-sub-text { font-size: 14px; }

    /* 사은품 이미지 */
    .benefit-gift-image {
      margin: 20px auto 0;
      width: 360px;
      height: 300px;
      border-radius: 8px;
      overflow: hidden;
      background: #f5f5f5;
    }
    .mobile-view .benefit-gift-image {
      width: 100%;
      height: auto;
      aspect-ratio: 360 / 300;
    }
    .benefit-gift-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .benefit-gift-notes {
      margin-top: 16px;
      font-size: 13px;
      color: #888;
      line-height: 1.8;
      white-space: pre-line;
    }

    /* 쿠폰 카드 */
    .benefit-coupon-card {
      margin: 24px auto 0;
      display: inline-flex;
      background: #1a1a1a;
      border-radius: 12px;
      overflow: hidden;
      max-width: 400px;
    }
    .coupon-left {
      padding: 24px 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 2px dashed #444;
    }
    .coupon-percent {
      font-size: 36px;
      font-weight: 700;
      color: #fff;
    }
    .mobile-view .coupon-percent { font-size: 28px; }
    .coupon-right {
      padding: 20px 28px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: left;
    }
    .coupon-name {
      font-size: 14px;
      font-weight: 600;
      color: #fff;
      margin-bottom: 4px;
    }
    .coupon-period {
      font-size: 12px;
      color: #888;
    }

    /* 혜택 추가 버튼 */
    .add-benefit-wrapper { position: relative; margin-top: 24px; }
    .add-benefit-btn {
      width: 100%;
      padding: 16px;
      background: transparent;
      border: 2px dashed #ddd;
      border-radius: 8px;
      cursor: pointer;
      color: #999;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
    }
    .add-benefit-btn:hover { border-color: #999; color: #666; }
    .benefit-type-menu {
      display: none;
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 8px;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      overflow: hidden;
      z-index: 100;
    }
    .benefit-type-menu.show { display: block; }
    .benefit-type-item {
      padding: 12px 20px;
      border: none;
      background: transparent;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #333;
      width: 100%;
      border-bottom: 1px solid #f0f0f0;
      font-family: inherit;
    }
    .benefit-type-item:last-child { border-bottom: none; }
    .benefit-type-item:hover { background: #f8f8f8; }

    /* ===== 콘텐츠 블록 공통 ===== */
    .content-block { position: relative; }
    .content-block.hidden-block {
      opacity: 0.4;
      pointer-events: none;
    }
    .content-block.hidden-block .block-controls,
    .content-block.hidden-block .block-drag-handle {
      pointer-events: auto;
      opacity: 1;
    }
    .content-block.dragging {
      opacity: 0.5;
      outline: 3px dashed #2563eb;
    }
    .content-block.drag-over {
      outline: 3px solid #2563eb;
      outline-offset: -3px;
    }

    /* ===== 기본형 콘텐츠 블록 ===== */
    .basic-block {
      width: 100%;
      height: 560px;
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
    }
    .mobile-view .basic-block { height: auto; aspect-ratio: 1080 / 840; }

    .basic-block.full-mode .basic-main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .basic-block.blur-mode .basic-blur-bg {
      position: absolute;
      top: -50px; left: -50px; right: -50px; bottom: -50px;
      background-size: cover;
      background-position: center;
      filter: blur(50px) saturate(1.2);
      opacity: 0.7;
    }
    .basic-block.blur-mode .basic-main-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 520px;
      height: 560px;
      object-fit: cover;
      z-index: 2;
    }
    .mobile-view .basic-block.blur-mode .basic-blur-bg { display: none; }
    .mobile-view .basic-block.blur-mode .basic-main-image {
      width: 100%;
      height: 100%;
      position: relative;
      top: auto;
      left: auto;
      transform: none;
    }
    .basic-text-overlay {
      position: absolute;
      bottom: 40px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: #fff;
      z-index: 5;
    }
    .basic-main-title {
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .mobile-view .basic-main-title { font-size: 22px; }
    .basic-sub-title {
      font-size: 16px;
      opacity: 0.9;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }
    .mobile-view .basic-sub-title { font-size: 14px; }

    /* ===== 자동 스와이프 블록 ===== */
    .swipe-block {
      position: relative;
      overflow: hidden;
    }
    .swipe-container {
      display: flex;
      transition: transform 0.5s ease;
    }
    .swipe-item {
      flex: 0 0 50%;
      height: 560px;
      position: relative;
      overflow: hidden;
    }
    .swipe-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mobile-view .swipe-item { 
      height: auto;
      aspect-ratio: 1 / 1.2;
    }
    .swipe-text-overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      color: #fff;
      z-index: 5;
    }
    .swipe-main-text {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
    }
    .swipe-sub-text {
      font-size: 15px;
      opacity: 0.9;
      margin-bottom: 4px;
    }
    .swipe-desc-text {
      font-size: 13px;
      opacity: 0.8;
      line-height: 1.6;
    }
    .swipe-indicators {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 10;
    }
    .swipe-indicator {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
      cursor: pointer;
      transition: all 0.3s;
    }
    .swipe-indicator.active {
      background: #fff;
    }
    /* 배경 컬러칩 */
    .swipe-block[data-bg="gray"] { background: #6b7280; }
    .swipe-block[data-bg="slate"] { background: #475569; }
    .swipe-block[data-bg="zinc"] { background: #52525b; }
    .swipe-block[data-bg="neutral"] { background: #525252; }
    .swipe-block[data-bg="stone"] { background: #57534e; }
    .swipe-block[data-bg="warm"] { background: #78716c; }
    .swipe-block[data-bg="cool"] { background: #64748b; }
    .swipe-block[data-bg="charcoal"] { background: #374151; }
    .swipe-block[data-bg="graphite"] { background: #3f3f46; }
    .swipe-block[data-bg="black"] { background: #1a1a1a; }

    /* ===== 2분할 블록 ===== */
    .split-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      position: relative;
    }
    .mobile-view .split-block { grid-template-columns: 1fr; }
    .split-item {
      height: 560px;
      position: relative;
      overflow: hidden;
      background: #1a1a1a;
    }
    .mobile-view .split-item { height: auto; aspect-ratio: 1 / 1.2; }

    /* 왼쪽: FULL 모드 */
    .split-item.full-mode .split-main-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* 오른쪽: BLUR 모드 */
    .split-item.blur-mode .split-blur-bg {
      position: absolute;
      top: -30px; left: -30px; right: -30px; bottom: -30px;
      background-size: cover;
      background-position: center;
      filter: blur(40px) saturate(1.2);
      opacity: 0.7;
    }
    .split-item.blur-mode .split-main-image {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      height: 100%;
      width: auto;
      max-width: none;
      object-fit: cover;
      z-index: 2;
    }
    .mobile-view .split-item.blur-mode .split-blur-bg { display: none; }
    .mobile-view .split-item.blur-mode .split-main-image {
      width: 100%;
      height: 100%;
      position: relative;
      top: auto;
      left: auto;
      transform: none;
    }
    .split-text-overlay {
      position: absolute;
      bottom: 40px;
      left: 40px;
      right: 40px;
      color: #fff;
      z-index: 5;
    }
    .split-main-title {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 8px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.4);
    }
    .split-sub-title {
      font-size: 15px;
      opacity: 0.9;
      text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    }

    /* ===== 지그재그 레이아웃 ===== */
    .zigzag-block {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      position: relative;
    }
    .zigzag-block.reversed { direction: rtl; }
    .zigzag-block.reversed > * { direction: ltr; }
    .mobile-view .zigzag-block { grid-template-columns: 1fr; }
    .zigzag-image {
      height: 600px;
      overflow: hidden;
    }
    .zigzag-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .mobile-view .zigzag-image { height: auto; aspect-ratio: 1 / 1; }
    .zigzag-content {
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 60px;
      background: #f8f8f8;
    }
    .mobile-view .zigzag-content { padding: 40px 24px; }
    .zigzag-title {
      font-size: 32px;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.3;
    }
    .mobile-view .zigzag-title { font-size: 24px; }
    .zigzag-desc {
      font-size: 16px;
      color: #666;
      line-height: 1.8;
    }

    /* ===== 여백 콜라주 ===== */
    .collage-block {
      padding: 80px 60px;
      background: #fff;
      position: relative;
    }
    .mobile-view .collage-block { padding: 40px 20px; }
    
    /* 유형1: 대형 + 소형 2개 */
    .collage-type1 {
      display: grid;
      grid-template-columns: 1.5fr 1fr;
      gap: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    .collage-type1 .collage-large {
      aspect-ratio: 3 / 4;
    }
    .collage-type1 .collage-small-group {
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    /* ===== 블록 추가 패널 ===== */
    .add-block-panel {

    /* ===== 에디터 모달 ===== */
    .edit-modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;

    }
    .edit-modal.show { display: flex; }
    .edit-modal-content {
      background: #fff;
      border-radius: 12px;
      padding: 28px;

    .edit-modal-title {

      font-weight: 500;

      margin-bottom: 8px;

    .edit-modal-input:focus { outline: none; border-color: #2563eb; }
    .edit-modal-textarea {

    }

      padding: 12px;

      font-size: 14px;
      font-weight: 600;
      cursor: pointer;

    }
    .edit-modal-btn.primary { background: #2563eb; color: #fff; }
    .edit-modal-btn.primary:hover { background: #1d4ed8; }
    .edit-modal-btn.secondary { background: #f5f5f5; color: #666; }
    .edit-modal-btn.secondary:hover { background: #e5e5e5; }

    /* 이미지 편집 섹션 */
    .image-edit-section {
      background: #f8f8f8;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .image-edit-label {
      font-size: 12px;
      font-weight: 600;
      color: #666;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .image-edit-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
    }
    .image-edit-row:last-child { margin-bottom: 0; }
    .image-edit-row label {
      font-size: 13px;
      color: #666;
      min-width: 50px;
    }
    .image-edit-row input[type="range"] {
      flex: 1;
      height: 6px;
      -webkit-appearance: none;
      background: #ddd;
      border-radius: 3px;
      outline: none;
    }
    .image-edit-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      background: #2563eb;
      border-radius: 50%;
      cursor: pointer;
    }
    .image-edit-row .value-display {
      font-size: 13px;
      color: #2563eb;
      font-weight: 600;
      min-width: 45px;
      text-align: right;
    }

    /* 모드 탭 */
    .mode-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .mode-tab {
      flex: 1;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      color: #666;
      text-align: center;
      transition: all 0.2s;
      font-family: inherit;
    }
    .mode-tab:hover { border-color: #2563eb; }
    .mode-tab.active {
      border-color: #2563eb;
      background: #2563eb;
      color: #fff;
    }

    /* 토글 스위치 */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid #f0f0f0;
    }
    .toggle-row:last-child { border-bottom: none; }
    .toggle-row label { font-size: 14px; color: #333; }
    .toggle-switch {
      position: relative;
      width: 44px;
      height: 24px;
    }
    .toggle-switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .toggle-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background: #ddd;
      border-radius: 24px;
      transition: 0.3s;
    }
    .toggle-slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background: #fff;
      border-radius: 50%;
      transition: 0.3s;
    }
    .toggle-switch input:checked + .toggle-slider { background: #2563eb; }
    .toggle-switch input:checked + .toggle-slider:before { transform: translateX(20px); }

    /* 업로드 버튼 */
    .upload-btn-wrapper {
      position: relative;
      overflow: hidden;
      display: inline-block;
      width: 100%;
    }
    .upload-btn {
      width: 100%;
      padding: 14px;
      background: #f8f8f8;
      border: 2px dashed #ddd;

      font-size: 14px;

    /* 이미지 리스트 */

    .image-list-item-remove {

      font-size: 14px;
    }
    .image-list-item-remove:hover { background: #fecaca; }

    /* 정렬 옵션 */
    .align-options {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .align-option {
      flex: 1;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      background: #fff;
      cursor: pointer;
      font-size: 13px;
      text-align: center;
      transition: all 0.2s;
      font-family: inherit;
    }
    .align-option:hover { border-color: #2563eb; }
    .align-option.active { border-color: #2563eb; background: #eff6ff; color: #2563eb; }

    /* 컬러칩 선택 */
    .color-chips {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .color-chip {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.2s;
    }
    .color-chip:hover { transform: scale(1.1); }
    .color-chip.active { border-color: #2563eb; }
    .color-chip[data-color="gray"] { background: #6b7280; }
    .color-chip[data-color="slate"] { background: #475569; }
    .color-chip[data-color="zinc"] { background: #52525b; }
    .color-chip[data-color="neutral"] { background: #525252; }
    .color-chip[data-color="stone"] { background: #57534e; }
    .color-chip[data-color="warm"] { background: #78716c; }
    .color-chip[data-color="cool"] { background: #64748b; }
    .color-chip[data-color="charcoal"] { background: #374151; }
    .color-chip[data-color="graphite"] { background: #3f3f46; }
    .color-chip[data-color="black"] { background: #1a1a1a; }

    /* 실시간 미리보기 */
    .live-preview-container {
      margin-top: 16px;
      border-radius: 8px;
      overflow: hidden;
      background: #f0f0f0;
      padding: 12px;
    }
    .live-preview-label {
      font-size: 11px;
      font-weight: 600;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }
    .live-preview-box {
      width: 100%;
      height: 180px;
      position: relative;
      overflow: hidden;
      border-radius: 6px;
      background: #1a1a1a;
    }
    .live-preview-box .live-preview-blur {
      position: absolute;
      top: -10px; left: -10px; right: -10px; bottom: -10px;
      background-size: cover;
      background-position: center;
      filter: blur(20px) saturate(1.2);
      opacity: 0.7;
    }
    .live-preview-box .live-preview-img {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);

      max-width: none;
      object-fit: cover;

    .live-preview-box.full-mode .live-preview-blur { display: none; }
    .live-preview-box.full-mode .live-preview-img {
      position: relative;
      top: auto; left: auto;
      transform: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>

  <!-- 에디터 컨트롤 패널 -->
  <div class="editor-panel">

  <!-- 프리뷰 컨테이너 -->

        <!-- 텍스트 오버레이 -->
        <div class="hero-text-overlay" id="heroTextOverlay">
          <div class="hero-text-inner" id="heroTextInner">

      </div>

    </div>

    // ===== 뷰 모드 =====
    function setViewMode(mode) {
      viewMode = mode;
      const container = document.getElementById('previewContainer');
      container.classList.toggle('mobile-view', mode === 'mobile');
      
      document.querySelectorAll('.editor-btns .editor-btn').forEach((btn, i) => {
        btn.classList.toggle('active', (i === 0 && mode === 'pc') || (i === 1 && mode === 'mobile'));
      });
    }

    // ===== 히어로 렌더링 =====
    function renderHeroSlides() {
      const container = document.getElementById('heroSlidesContainer');
      const indicators = document.getElementById('heroIndicators');
      
      let slidesHtml = '';
      let indicatorsHtml = '';
      
      heroData.slides.forEach((slide, i) => {
        const isActive = i === currentHeroSlide ? 'active' : '';
        const modeClass = heroData.mode === 'full' ? 'full-mode' : 'blur-mode';
        
        if (heroData.mode === 'blur') {
          slidesHtml += `
            <div class="hero-slide ${isActive} ${modeClass}">
              <div class="hero-blur-bg" style="background-image: url('${slide.image}');"></div>
              <img class="hero-main-image" src="${slide.image}" alt="" style="transform: translate(-50%, -50%) scale(${slide.zoom / 100}); object-position: ${slide.posX}% ${slide.posY}%;">
            </div>
          `;
        } else {
          slidesHtml += `
            <div class="hero-slide ${isActive} ${modeClass}">
              <img class="hero-main-image" src="${slide.image}" alt="" style="transform: scale(${slide.zoom / 100}); object-position: ${slide.posX}% ${slide.posY}%;">
            </div>
          `;
        }
        
        indicatorsHtml += `<div class="hero-indicator ${isActive}" onclick="goToHeroSlide(${i})"></div>`;
      });
      
      container.innerHTML = slidesHtml;
      indicators.innerHTML = indicatorsHtml;
      indicators.style.display = heroData.slides.length > 1 ? 'flex' : 'none';
      
      startHeroSlideshow();
    }

    function renderHeroText() {
      const overlay = document.getElementById('heroTextOverlay');
      const inner = document.getElementById('heroTextInner');
      const logo = document.getElementById('heroLogo');
      const mainText = document.getElementById('heroMainText');
      const subText = document.getElementById('heroSubText');
      
      overlay.className = `hero-text-overlay align-${heroData.textAlign}`;
      
      if (heroData.logoImage) {
        logo.innerHTML = `<img src="${heroData.logoImage}" alt="logo">`;
      } else {
        logo.textContent = heroData.logo;
      }
      
      mainText.innerHTML = heroData.mainText.replace(/\n/g, '<br>');
      mainText.className = `hero-main-text ${heroData.mainTextLines === 2 ? 'two-line' : ''}`;
      
      subText.innerHTML = heroData.subText.replace(/\n/g, '<br>');
      subText.className = `hero-sub-text ${heroData.subTextLines === 2 ? 'two-line' : ''}`;
    }

    function startHeroSlideshow() {
      if (heroSlideInterval) clearInterval(heroSlideInterval);
      
      if (heroData.slides.length > 1) {
        heroSlideInterval = setInterval(() => {
          currentHeroSlide = (currentHeroSlide + 1) % heroData.slides.length;
          updateHeroSlideView();
        }, 3000);
      }
    }

    function goToHeroSlide(index) {
      currentHeroSlide = index;
      updateHeroSlideView();
      startHeroSlideshow();
    }

    function updateHeroSlideView() {
      const slides = document.querySelectorAll('.hero-slide');
      const indicators = document.querySelectorAll('.hero-indicator');
      
      slides.forEach((slide, i) => {
        slide.classList.toggle('active', i === currentHeroSlide);
      });
      
      indicators.forEach((indicator, i) => {
        indicator.classList.toggle('active', i === currentHeroSlide);
      });
    }

    // ===== 혜택 렌더링 =====
    function renderBenefits() {
      const wrapper = document.getElementById('benefitWrapper');
      
      let html = benefits.map((b, i) => {
        let itemHtml = `
          <div class="benefit-item">
            <div class="benefit-item-controls">
              <button class="overlay-ctrl-btn" onclick="editBenefit(${i})">✏️</button>
              <button class="overlay-ctrl-btn" onclick="deleteBenefit(${i})" style="color:#dc2626;">🗑️</button>
            </div>
            <p class="benefit-main-title">${b.mainTitle}</p>
            <p class="benefit-sub-text">${b.subText}</p>
        `;
        
        if (b.type === 'gift' && b.showImage) {
          itemHtml += `
            <div class="benefit-gift-image">
              <img src="${b.image}" alt="사은품">
            </div>
            <p class="benefit-gift-notes">${b.notes || ''}</p>
          `;
        }
        
        if (b.type === 'coupon' && b.couponPercent) {
          itemHtml += `
            <div class="benefit-coupon-card">
              <div class="coupon-left">
                <span class="coupon-percent">${b.couponPercent}</span>
              </div>
              <div class="coupon-right">
                <p class="coupon-name">${b.couponName || ''}</p>
                <p class="coupon-period">${b.couponPeriod || ''}</p>
              </div>
            </div>
          `;
        }
        
        itemHtml += '</div>';
        return itemHtml;
      }).join('');
      
      html += `
        <div class="add-benefit-wrapper">
          <button class="add-benefit-btn" onclick="toggleBenefitMenu()">
            <span>+</span> 혜택 추가
          </button>

    function toggleBenefitMenu() {
      document.getElementById('benefitTypeMenu').classList.toggle('show');

    function addBenefit(type) {
      const defaults = {
        text: { type: 'text', mainTitle: '새 혜택', subText: '설명을 입력하세요' },
        gift: { type: 'gift', mainTitle: '기프트 혜택', subText: '사은품 설명', showImage: true, image: '', notes: '*유의사항' },

      };
      benefits.push(defaults[type]);
      renderBenefits();
      document.getElementById('benefitTypeMenu').classList.remove('show');
      editBenefit(benefits.length - 1);
    }

    function deleteBenefit(index) {
      if (confirm('이 혜택을 삭제하시겠습니까?')) {
        benefits.splice(index, 1);
        renderBenefits();
      }

      currentEditType = 'benefit';

      openEditModal('benefit');

    // ===== 블록 렌더링 =====
    function renderBlocks() {
      const container = document.getElementById('blocksContainer');
      let html = '';
      
      blocks.forEach((block, i) => {
        const hiddenClass = block.visible ? '' : 'hidden-block';
        const toggleIcon = block.visible ? '👁️' : '🙈';
        
        const dragHandle = `<div class="block-drag-handle" draggable="true" ondragstart="dragStart(event, ${i})" ondragend="dragEnd(event)">⋮⋮</div>`;
        
        const controls = `
          <div class="block-controls">
            <span class="block-label">${getBlockLabel(block.type)}</span>
            <button class="block-ctrl-btn toggle" onclick="toggleBlock(${i})">${toggleIcon}</button>
            <button class="block-ctrl-btn delete" onclick="deleteBlock(${i})">🗑️</button>
          </div>
        `;
        
        if (block.type === 'basic') {
          html += renderBasicBlock(block, i, dragHandle, controls, hiddenClass);
        } else if (block.type === 'swipe') {
          html += renderSwipeBlock(block, i, dragHandle, controls, hiddenClass);
        } else if (block.type === 'split') {
          html += renderSplitBlock(block, i, dragHandle, controls, hiddenClass);
        } else if (block.type === 'zigzag') {
          html += renderZigzagBlock(block, i, dragHandle, controls, hiddenClass);
        } else if (block.type === 'collage') {
          html += renderCollageBlock(block, i, dragHandle, controls, hiddenClass);
        } else if (block.type === 'products') {
          html += renderProductsBlock(block, i, dragHandle, controls, hiddenClass);
        }
      });
      
      container.innerHTML = html;
      initSwipeBlocks();
    }

    function renderBasicBlock(block, i, dragHandle, controls, hiddenClass) {
      const modeClass = block.mode === 'full' ? 'full-mode' : 'blur-mode';
      
      let imageHtml = '';
      if (block.mode === 'blur') {
        imageHtml = `
          <div class="basic-blur-bg" style="background-image: url('${block.image}');"></div>
          <img class="basic-main-image" src="${block.image}" alt="">
        `;
      } else {
        imageHtml = `<img class="basic-main-image" src="${block.image}" alt="">`;
      }
      
      return `
        <section class="content-block basic-block ${modeClass} ${hiddenClass}" data-index="${i}" ondragover="dragOver(event)" ondrop="drop(event, ${i})" ondragleave="dragLeave(event)">
          ${dragHandle}
          ${controls}
          ${imageHtml}
          <div class="basic-text-overlay">
            <h3 class="basic-main-title">${block.mainTitle}</h3>
            <p class="basic-sub-title">${block.subTitle}</p>
          </div>
          <div class="overlay-controls">
            <button class="overlay-ctrl-btn ${block.mode === 'full' ? 'active' : ''}" onclick="setBasicMode(${i}, 'full')">FULL</button>
            <button class="overlay-ctrl-btn ${block.mode === 'blur' ? 'active' : ''}" onclick="setBasicMode(${i}, 'blur')">BLUR</button>
            <button class="overlay-ctrl-btn" onclick="openBlockEdit(${i})">✏️ 편집</button>
          </div>
        </section>
      `;
    }

    function renderSwipeBlock(block, i, dragHandle, controls, hiddenClass) {
      const imagesHtml = block.images.map((img, j) => `
        <div class="swipe-item">
          <img src="${img.src}" alt="">
          <div class="swipe-text-overlay">
            <h3 class="swipe-main-text">${img.mainText}</h3>
            <p class="swipe-sub-text">${img.subText}</p>
            <p class="swipe-desc-text">${img.desc}</p>
          </div>
        </div>
      `).join('');
      
      const indicatorsHtml = block.images.length > 2 ? block.images.map((_, j) => 
        `<div class="swipe-indicator ${j === 0 ? 'active' : ''}" data-block="${i}" data-slide="${j}"></div>`
      ).join('') : '';
      
      return `
        <section class="content-block swipe-block ${hiddenClass}" data-index="${i}" data-bg="${block.bgColor}" ondragover="dragOver(event)" ondrop="drop(event, ${i})" ondragleave="dragLeave(event)">
          ${dragHandle}
          ${controls}
          <div class="swipe-container" data-block="${i}">
            ${imagesHtml}
          </div>
          ${block.images.length > 2 ? `<div class="swipe-indicators">${indicatorsHtml}</div>` : ''}
          <div class="overlay-controls">
            <button class="overlay-ctrl-btn" onclick="openBlockEdit(${i})">✏️ 편집</button>
          </div>
        </section>
      `;
    }

    function renderSplitBlock(block, i, dragHandle, controls, hiddenClass) {
      return `
        <section class="content-block split-block ${hiddenClass}" data-index="${i}" ondragover="dragOver(event)" ondrop="drop(event, ${i})" ondragleave="dragLeave(event)">
          ${dragHandle}
          ${controls}
          <div class="split-item full-mode">
            <img class="split-main-image" src="${block.leftImage}" alt="">

              <h3 class="split-main-title">${block.leftTitle}</h3>
              <p class="split-sub-title">${block.leftSub}</p>
            </div>
          </div>
          <div class="split-item blur-mode">
            <div class="split-blur-bg" style="background-image: url('${block.rightImage}');"></div>
            <img class="split-main-image" src="${block.rightImage}" alt="">

              <h3 class="split-main-title">${block.rightTitle}</h3>
              <p class="split-sub-title">${block.rightSub}</p>

      const reversedClass = block.reversed ? 'reversed' : '';

          ${controls}

            <img src="${block.image}" alt="">

          <div class="zigzag-content" style="background: ${block.bgColor};">
            <h3 class="zigzag-title">${block.title.replace(/\n/g, '<br>')}</h3>
            <p class="zigzag-desc">${block.desc.replace(/\n/g, '<br>')}</p>
          </div>
          <div class="overlay-controls">
            <button class="overlay-ctrl-btn ${block.reversed ? 'active' : ''}" onclick="toggleZigzagReverse(${i})">↔️ 반전</button>
            <button class="overlay-ctrl-btn" onclick="openBlockEdit(${i})">✏️ 편집</button>
          </div>
        </section>
      `;
    }

      const typeClass = block.collageType === 2 ? 'collage-type2' : 'collage-type1';
      
      let imagesHtml = '';
      if (block.collageType === 2) {
        imagesHtml = (block.images || []).slice(0, 3).map(img => 
          `<div class="collage-image"><img src="${img}" alt=""></div>`

          <div class="collage-small-group">
            <div class="collage-small collage-image"><img src="${images[1] || ''}" alt=""></div>
            <div class="collage-small collage-image"><img src="${images[2] || ''}" alt=""></div>
          </div>

      return `

          ${dragHandle}
          ${controls}

    function initSwipeBlocks() {
      blocks.forEach((block, i) => {
        if (block.type === 'swipe' && block.images.length > 2) {

        }

    }

    function startSwipeAnimation(blockIndex) {
      const container = document.querySelector(`.swipe-container[data-block="${blockIndex}"]`);
      if (!container) return;
      
      let currentSlide = 0;
      const totalSlides = blocks[blockIndex].images.length;
      
      setInterval(() => {
        currentSlide = (currentSlide + 1) % totalSlides;
        container.style.transform = `translateX(-${currentSlide * 50}%)`;
        
        // 인디케이터 업데이트
        document.querySelectorAll(`.swipe-indicator[data-block="${blockIndex}"]`).forEach((ind, j) => {
          ind.classList.toggle('active', j === currentSlide);
        });
      }, 3000);
    }

    // ===== 드래그 앤 드롭 =====
    let draggedIndex = null;

    function dragStart(event, index) {
      draggedIndex = index;
      event.target.closest('.content-block').classList.add('dragging');
      event.dataTransfer.effectAllowed = 'move';
    }

    function dragEnd(event) {
      document.querySelectorAll('.content-block').forEach(el => {
        el.classList.remove('dragging', 'drag-over');
      });
      draggedIndex = null;
    }

    function dragOver(event) {
      event.preventDefault();
      const block = event.target.closest('.content-block');
      if (block && !block.classList.contains('dragging')) {
        block.classList.add('drag-over');
      }
    }

    function dragLeave(event) {
      const block = event.target.closest('.content-block');
      if (block) block.classList.remove('drag-over');
    }

    function drop(event, targetIndex) {
      event.preventDefault();
      const block = event.target.closest('.content-block');
      if (block) block.classList.remove('drag-over');
      
      if (draggedIndex !== null && draggedIndex !== targetIndex) {
        const draggedItem = blocks.splice(draggedIndex, 1)[0];
        blocks.splice(targetIndex, 0, draggedItem);
        renderBlocks();
      }
      draggedIndex = null;
    }

              <input type="file" accept="image/*" onchange="uploadSplitImage(this, 'left')">
            </div>
            <input type="text" class="edit-modal-input" id="editLeftTitle" value="${b.leftTitle}" placeholder="왼쪽 타이틀" style="margin-top:8px;">
            <input type="text" class="edit-modal-input" id="editLeftSub" value="${b.leftSub}" placeholder="왼쪽 서브" style="margin-top:8px;">
          </div>
          <div class="image-edit-section">
            <p class="image-edit-label">오른쪽 (BLUR 모드)</p>
            <div class="upload-btn-wrapper">
              <button class="upload-btn">📷 오른쪽 이미지</button>
              <input type="file" accept="image/*" onchange="uploadSplitImage(this, 'right')">
            </div>
            <input type="text" class="edit-modal-input" id="editRightTitle" value="${b.rightTitle}" placeholder="오른쪽 타이틀" style="margin-top:8px;">
            <input type="text" class="edit-modal-input" id="editRightSub" value="${b.rightSub}" placeholder="오른쪽 서브" style="margin-top:8px;">
          </div>
        `;
        btns.innerHTML = `
          <button class="edit-modal-btn secondary" onclick="closeEditModal()">취소</button>
          <button class="edit-modal-btn primary" onclick="saveSplitBlock()">저장</button>
        `;
      } else if (type === 'zigzag') {
        const b = blocks[currentEditIndex];
        title.textContent = '지그재그 블록 편집';
        fieldsHtml = `
          <div class="toggle-row">
            <label>좌우 반전</label>
            <label class="toggle-switch">
              <input type="checkbox" id="editZigzagReverse" ${b.reversed ? 'checked' : ''}>
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="edit-modal-field">
            <label class="edit-modal-label">이미지</label>
            <div class="upload-btn-wrapper">
              <button class="upload-btn">📷 이미지 업로드</button>
              <input type="file" accept="image/*" onchange="uploadZigzagImage(this)">
            </div>
          </div>
          <div class="edit-modal-field">
            <label class="edit-modal-label">타이틀</label>
            <textarea class="edit-modal-textarea" id="editZigzagTitle">${b.title}</textarea>
          </div>
          <div class="edit-modal-field">
            <label class="edit-modal-label">설명</label>
            <textarea class="edit-modal-textarea" id="editZigzagDesc">${b.desc}</textarea>
          </div>
        `;
        btns.innerHTML = `
          <button class="edit-modal-btn secondary" onclick="closeEditModal()">취소</button>
          <button class="edit-modal-btn primary" onclick="saveZigzagBlock()">저장</button>
        `;
      } else if (type === 'products') {
        const b = blocks[currentEditIndex];
        title.textContent = '상품단 블록 편집';
        fieldsHtml = `
          <div class="edit-modal-field">
            <label class="edit-modal-label">섹션 타이틀</label>
            <input type="text" class="edit-modal-input" id="editProductTitle" value="${b.title}">
          </div>
          <div class="edit-modal-field">
            <label class="edit-modal-label">컬럼 수</label>
            <div class="mode-tabs">
              <button class="mode-tab ${b.columns === 2 ? 'active' : ''}" onclick="blocks[${currentEditIndex}].columns=2;document.querySelectorAll('.mode-tab').forEach((t,i)=>t.classList.toggle('active',i===0));">2단</button>
              <button class="mode-tab ${b.columns === 4 ? 'active' : ''}" onclick="blocks[${currentEditIndex}].columns=4;document.querySelectorAll('.mode-tab').forEach((t,i)=>t.classList.toggle('active',i===1));">4단</button>
              <button class="mode-tab ${b.columns === 6 ? 'active' : ''}" onclick="blocks[${currentEditIndex}].columns=6;document.querySelectorAll('.mode-tab').forEach((t,i)=>t.classList.toggle('active',i===2));">6단</button>
            </div>
          </div>
          <div class="edit-modal-field">
            <label class="edit-modal-label">상품 코드 (한 줄에 하나씩)</label>
            <textarea class="edit-modal-textarea" id="editProductCodes" style="min-height:150px;font-family:monospace;">${b.productCodes || ''}</textarea>
            <p style="font-size:12px;color:#888;margin-top:8px;">예시:<br>12345678<br>91011123</p>
          </div>
        `;
        btns.innerHTML = `
          <button class="edit-modal-btn secondary" onclick="closeEditModal()">취소</button>
          <button class="edit-modal-btn primary" onclick="saveProductBlock()">저장</button>
        `;
      }
      
      fields.innerHTML = fieldsHtml;
      modal.classList.add('show');
    }

    function closeEditModal() {
      document.getElementById('editModal').classList.remove('show');
      currentEditType = null;
      currentEditIndex = null;
    }

    // 저장 함수들
    function saveHeroText() {
      heroData.logo = document.getElementById('editHeroLogo').value;
      heroData.mainText = document.getElementById('editHeroMain').value;
      heroData.subText = document.getElementById('editHeroSub').value;
      renderHeroText();
      closeEditModal();
    }

    function saveBenefit() {
      const b = benefits[currentEditIndex];
      b.mainTitle = document.getElementById('editBenefitMain').value;
      b.subText = document.getElementById('editBenefitSub').value;
      
      if (b.type === 'gift') {
        b.showImage = document.getElementById('editGiftShowImage').checked;
        b.notes = document.getElementById('editGiftNotes').value;
      }
      if (b.type === 'coupon') {
        b.couponPercent = document.getElementById('editCouponPercent').value;
        b.couponName = document.getElementById('editCouponName').value;
        b.couponPeriod = document.getElementById('editCouponPeriod').value;
      }
      
      renderBenefits();
      closeEditModal();
    }

    function saveNotice() {
      notices[currentEditIndex].title = document.getElementById('editNoticeTitle').value;
      notices[currentEditIndex].content = document.getElementById('editNoticeContent').value;
      renderNotices();
      closeEditModal();
    }

    function saveBasicBlock() {
      const b = blocks[currentEditIndex];
      b.mainTitle = document.getElementById('editBlockMain').value;
      b.subTitle = document.getElementById('editBlockSub').value;
      renderBlocks();
      closeEditModal();
    }

    function saveSplitBlock() {
      const b = blocks[currentEditIndex];
      b.leftTitle = document.getElementById('editLeftTitle').value;
      b.leftSub = document.getElementById('editLeftSub').value;
      b.rightTitle = document.getElementById('editRightTitle').value;
      b.rightSub = document.getElementById('editRightSub').value;
      renderBlocks();
      closeEditModal();
    }

    function saveZigzagBlock() {
      const b = blocks[currentEditIndex];
      b.reversed = document.getElementById('editZigzagReverse').checked;
      b.title = document.getElementById('editZigzagTitle').value;
      b.desc = document.getElementById('editZigzagDesc').value;
      renderBlocks();
      closeEditModal();
    }

    function saveProductBlock() {
      const b = blocks[currentEditIndex];
      b.title = document.getElementById('editProductTitle').value;
      b.productCodes = document.getElementById('editProductCodes').value;
      renderBlocks();
      closeEditModal();
    }

    // 히어로 관련 함수
    function setHeroMode(mode) {
      heroData.mode = mode;
      renderHeroSlides();
      openEditModal('hero-image');
    }

    function setHeroAlign(align) {
      heroData.textAlign = align;
      document.querySelectorAll('.align-option').forEach(opt => {
        opt.classList.toggle('active', opt.textContent.includes(align === 'left' ? '좌' : align === 'right' ? '우' : '중'));
      });
      renderHeroText();
    }

    function setMainTextLines(lines) {
      heroData.mainTextLines = lines;
    }

    function setSubTextLines(lines) {
      heroData.subTextLines = lines;
    }

    function addHeroSlide(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          heroData.slides.push({
            image: e.target.result,
            zoom: 100,
            posX: 50,
            posY: 50
          });
          renderHeroSlides();
          openEditModal('hero-image');
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function removeHeroSlide(index) {
      if (heroData.slides.length > 1) {
        heroData.slides.splice(index, 1);
        if (currentHeroSlide >= heroData.slides.length) {
          currentHeroSlide = heroData.slides.length - 1;
        }
        renderHeroSlides();
        openEditModal('hero-image');
      } else {
        alert('최소 1개의 이미지가 필요합니다.');
      }
    }

    function editHeroSlide(index) {
      // 간단한 슬라이드 편집
      alert('슬라이드 ' + (index + 1) + ' 편집 기능');
    }

    function uploadHeroLogo(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          heroData.logoImage = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 혜택 이미지 업로드
    function uploadGiftImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          benefits[currentEditIndex].image = e.target.result;
          const preview = document.getElementById('giftPreview');
          preview.classList.remove('hidden');
          preview.querySelector('img').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    // 블록 이미지 업로드
    function uploadBlockImage(input, index) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          blocks[index].image = e.target.result;
          document.querySelector('#blockPreview img').src = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function uploadSplitImage(input, side) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          if (side === 'left') {
            blocks[currentEditIndex].leftImage = e.target.result;
          } else {
            blocks[currentEditIndex].rightImage = e.target.result;
          }
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function uploadZigzagImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          blocks[currentEditIndex].image = e.target.result;
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function setSwipeBgColor(color) {
      blocks[currentEditIndex].bgColor = color;
      document.querySelectorAll('.color-chip').forEach(c => {
        c.classList.toggle('active', c.dataset.color === color);
      });
    }

    function addSwipeImage(input) {
      if (input.files && input.files[0]) {
        const reader = new FileReader();
        reader.onload = function(e) {
          if (blocks[currentEditIndex].images.length < 10) {
            blocks[currentEditIndex].images.push({
              src: e.target.result,
              mainText: 'NEW',
              subText: '',
              desc: ''
            });
            openEditModal('swipe');
          } else {
            alert('최대 10개까지 추가 가능합니다.');
          }
        };
        reader.readAsDataURL(input.files[0]);
      }
    }

    function removeSwipeImage(index) {
      if (blocks[currentEditIndex].images.length > 2) {
        blocks[currentEditIndex].images.splice(index, 1);
        openEditModal('swipe');
      } else {
        alert('최소 2개의 이미지가 필요합니다.');
      }
    }

    // 에디터 기능
    function resetEditor() {
      if (confirm('모든 내용을 초기화하시겠습니까?')) {
        location.reload();
      }
    }

    function exportHTML() {
      alert('HTML 추출 기능 - 현재 설정된 내용을 HTML로 변환합니다.');
      // 실제 구현 시 프리뷰 영역의 HTML을 추출
    }

    // 모달 외부 클릭
    document.getElementById('editModal').addEventListener('click', function(e) {
      if (e.target === this) closeEditModal();
    });

    // 메뉴 외부 클릭
    document.addEventListener('click', function(e) {
      if (!e.target.closest('.add-benefit-wrapper')) {
        const menu = document.getElementById('benefitTypeMenu');
        if (menu) menu.classList.remove('show');
      }
    });

    // ===== 초기화 =====
    function init() {
      renderHeroSlides();
      renderHeroText();
      renderBenefits();
      renderBlocks();
      renderNotices();
    }

    init();
  </script>

</body>
</html>
